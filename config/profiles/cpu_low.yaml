# ===========================================================================
# Profile: cpu_low
#
# Target: 2-4 core laptop CPU, no discrete GPU.
# This is the profile your Intel i5-7200U (2 cores / 4 threads) selects.
#
# Strategy: small quantised models, one model running at a time, streaming
# transcription so that end-of-utterance latency is the cost of the final
# audio chunk rather than the whole sentence.
#
# Only keys that DIFFER from config/default.yaml belong here.
# ===========================================================================

stt:
  # Measured on an Intel i5-7200U (int8, 2 threads), per utterance:
  #   tiny 0.85 s - error-prone
  #   base 1.70 s - correct on clear English   <- chosen
  #   small 5.88 s - unusable
  # Phase 1 estimated small at ~0.55 real-time factor. The measurement was
  # roughly eight times worse, because Whisper's encoder always processes a
  # fixed 30-second window and dominates the cost on CPU.
  model: base
  device: cpu
  compute_type: int8
  # PHYSICAL cores, not logical: 4 threads measured slower than 2 on this
  # 2-core CPU because hyperthread siblings contend for the same units.
  cpu_threads: 2
  beam_size: 1
  # Every interim decode costs a full encoder pass, so streaming adds load
  # without reducing end-of-utterance latency on this hardware.
  streaming: false
  chunk_ms: 3000

translation:
  provider: indictrans2
  device: cpu
  compute_type: int8
  beam_size: 1

tts:
  # Piper is the fastest CPU text-to-speech available and its models are
  # ~60 MB VITS networks - roughly 10x real-time on this class of CPU.
  provider: piper
  device: cpu

pipeline:
  # One inference at a time. Oversubscribing 2 cores makes everything slower.
  inference_lane: serial
  queue_maxsize: 2

vad:
  min_silence_ms: 350
