# ===========================================================================
# Profile: cpu_low
#
# Target: 2-4 core laptop CPU, no discrete GPU.
# This is the profile your Intel i5-7200U (2 cores / 4 threads) selects.
#
# Strategy: small quantised models, one model running at a time, streaming
# transcription so that end-of-utterance latency is the cost of the final
# audio chunk rather than the whole sentence.
#
# Only keys that DIFFER from config/default.yaml belong here.
# ===========================================================================

stt:
  # Measured on an Intel i5-7200U (int8, 2 threads), per utterance:
  #   tiny 0.85 s - error-prone
  #   base 1.70 s - correct on clear English   <- chosen
  #   small 5.88 s - unusable
  # Phase 1 estimated small at ~0.55 real-time factor. The measurement was
  # roughly eight times worse, because Whisper's encoder always processes a
  # fixed 30-second window and dominates the cost on CPU.
  model: base
  device: cpu
  compute_type: int8
  # PHYSICAL cores, not logical: 4 threads measured slower than 2 on this
  # 2-core CPU because hyperthread siblings contend for the same units.
  cpu_threads: 2
  beam_size: 1
  # streaming, chunk_ms: inherited from default.yaml. This profile used to
  # force streaming off, from the Phase 4 era when "streaming" meant
  # Whisper interim decodes (full encoder passes for zero latency gain).
  # Since Phase 10 it means the conformer's chunked commitment and the
  # English partner stream - both designed FOR this hardware tier - and the
  # stale override was silently disabling them in every real session.

translation:
  provider: indictrans2
  device: cpu
  compute_type: int8
  # Measured on this tier: beam 4 still answers in 0.19-1.3 s per sentence,
  # so unlike speech recognition the quality of beam search is affordable.
  beam_size: 4

# tts: inherited from default.yaml - Piper English (RTF 0.29 measured on
# this tier) and MMS Tamil, both through sherpa-onnx.

pipeline:
  # One inference at a time. Oversubscribing 2 cores makes everything slower.
  inference_lane: serial
  queue_maxsize: 2

# vad: inherited from default.yaml. A 350 ms override here outlived the
# measurement that raised the default to 500 ms (mid-sentence fragmentation
# destroys translation quality) and was silently undoing it.
