# ===========================================================================
# Profile: cpu_high
#
# Target: 6+ physical core desktop CPU, no usable discrete GPU.
# Enough cores to overlap pipeline stages and run a larger acoustic model.
# ===========================================================================

stt:
  # `small` needs roughly 6 physical cores to decode an utterance in about a
  # second; `medium` is out of reach on CPU for real-time use.
  model: small
  device: cpu
  compute_type: int8
  cpu_threads: 6
  beam_size: 1
  streaming: false
  chunk_ms: 3000

translation:
  provider: indictrans2
  device: cpu
  compute_type: int8
  beam_size: 4

# tts: inherited from default.yaml.

pipeline:
  inference_lane: parallel
  queue_maxsize: 4

vad:
  min_silence_ms: 320
