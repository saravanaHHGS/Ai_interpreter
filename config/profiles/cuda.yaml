# ===========================================================================
# Profile: cuda
#
# Target: NVIDIA GPU with >= 6 GB VRAM (RTX 3060 class and above).
# Full-quality models, overlapping pipeline stages, fp16 inference.
#
# Nothing in the application changes when you move to this profile - only the
# adapters that the composition root builds. That is the entire point of the
# ports-and-adapters architecture.
# ===========================================================================

stt:
  model: large-v3-turbo
  device: cuda
  compute_type: float16
  cpu_threads: 4
  beam_size: 1
  # Affordable on a GPU, where an encoder pass is tens of milliseconds rather
  # than seconds - so live captions cost little.
  streaming: true
  chunk_ms: 2000
  word_timestamps: true

translation:
  provider: indictrans2
  device: cuda
  compute_type: float16
  beam_size: 4

tts:
  # Same voices as CPU for now. Kokoro-82M (Apache-2.0, sherpa-onnx supports
  # it) is the intended upgrade on this tier once measured on real hardware.
  provider: sherpa-vits
  voices:
    en: piper-en-lessac
    ta: mms-tam
  device: cuda

pipeline:
  inference_lane: parallel
  queue_maxsize: 4

vad:
  min_silence_ms: 300
