# ===========================================================================
# Model registry.
#
# Every model the application can download is declared here with an exact
# repository revision. Pinning a commit rather than tracking a branch means an
# upstream repository cannot silently change the weights you are running - a
# supply-chain safeguard with no downside, since a deliberate upgrade is a
# one-line edit here.
#
# `files` lists only what is actually needed. The Silero repository publishes
# eight quantised variants; we download one.
# ===========================================================================

models:
  # -- Speech to text ------------------------------------------------------
  #
  # CTranslate2 conversions of OpenAI Whisper, run by faster-whisper.
  #
  # Measured on the target machine (Intel i5-7200U, int8, 2 threads, warmed
  # up). Note that the times are per *utterance*, not per second of audio:
  # Whisper pads its encoder to a fixed 30-second window, so a 2-second
  # utterance costs the same as a 10-second one.
  #
  #   tiny    0.85 s   noticeably error-prone
  #   base    1.70 s   correct on clear English - the cpu_low default
  #   small   5.88 s   unusable on this CPU
  #
  # File lists are exact: `model.bin` plus its tokeniser, and nothing else.
  # The README is not downloaded.
  whisper-tiny:
    task: stt
    repo_id: Systran/faster-whisper-tiny
    revision: d90ca5fe260221311c53c58e660288d3deb8d356
    languages: ["*"]
    size_mb: 75
    runtime: ctranslate2
    files: [config.json, model.bin, tokenizer.json, vocabulary.txt]

  whisper-base:
    task: stt
    repo_id: Systran/faster-whisper-base
    revision: ebe41f70d5b6dfa9166e2c581c45c9c0cfc57b66
    languages: ["*"]
    size_mb: 145
    runtime: ctranslate2
    files: [config.json, model.bin, tokenizer.json, vocabulary.txt]

  whisper-small:
    task: stt
    repo_id: Systran/faster-whisper-small
    revision: 536b0662742c02347bc0e980a01041f333bce120
    languages: ["*"]
    size_mb: 484
    runtime: ctranslate2
    files: [config.json, model.bin, tokenizer.json, vocabulary.txt]

  whisper-medium:
    task: stt
    repo_id: Systran/faster-whisper-medium
    revision: 08e178d48790749d25932bbc082711ddcfdfbc4f
    languages: ["*"]
    size_mb: 1530
    runtime: ctranslate2
    files: [config.json, model.bin, tokenizer.json, vocabulary.txt]

  # Tamil fine-tune, already published in CTranslate2 int8 form.
  #
  # Measured on one 6.72-second Tamil utterance against a written reference,
  # on the target machine:
  #
  #   whisper-base         1.6 s   ~80% word error   unusable
  #   whisper-small        5.2 s   ~50% word error   marginal
  #   whisper-tamil-small  6.9 s    ~8% word error   accurate
  #
  # Generic Whisper is simply weak at Tamil: the fine-tune recovers almost
  # all of the accuracy, including proper nouns, and the remaining problem is
  # purely speed. It decodes a little slower than the generic model of the
  # same size because a correct transcript contains more tokens than a
  # truncated wrong one.
  #
  # Tamil only. `languages` is enforced: the recogniser refuses other
  # languages rather than producing confident nonsense.
  whisper-tamil-small:
    task: stt
    repo_id: ukta-app/whisper-tamil-ct2
    revision: fd6de42af4f590e063ec0fc72bc9bfd6c13a4595
    languages: ["ta"]
    size_mb: 253
    runtime: ctranslate2
    files:
      [config.json, model.bin, preprocessor_config.json, tokenizer.json, vocabulary.json]

  # GPU profile only. The distilled decoder makes it far faster than
  # large-v3 while keeping most of its accuracy.
  whisper-large-v3-turbo:
    task: stt
    repo_id: deepdml/faster-whisper-large-v3-turbo-ct2
    revision: 4df90f75321148c3a29a9e2351b7ddf8f5b115a8
    languages: ["*"]
    size_mb: 1620
    runtime: ctranslate2
    files:
      [config.json, model.bin, preprocessor_config.json, tokenizer.json, vocabulary.json]

  # AI4Bharat IndicConformer Tamil, CTC, int8 ONNX export by OpenVoiceOS.
  #
  # Measured against the same written Tamil reference used to score the
  # Whisper models, on the target machine (2 threads):
  #
  #   whisper-tamil-small  6.2-10.5 s/utt   ~0-8% word error
  #   indicconformer-ta    RTF 0.55         ~0-3% word error  <- better AND faster
  #
  # Decode cost is LINEAR in audio length (533 ms per second of audio),
  # which is what makes chunked incremental decoding - and therefore true
  # streaming on CPU - possible. See docs/architecture.md section 0.
  #
  # The export ships without the metadata sherpa-onnx requires, so the
  # values below are stamped into a patched copy after download (a
  # consequence of constraint C6: PyTorch is blocked on the target machine,
  # making a proper re-export impossible locally).
  #
  # files[0] is the model, files[1] the token table - the loader relies on
  # this ordering.
  indicconformer-ta:
    task: stt
    repo_id: OpenVoiceOS/ai4bharat-indicconformer-ta-onnx
    revision: 10e43940d12106763c3aebe1922b70d37fc0c6fd
    languages: ["ta"]
    size_mb: 138
    runtime: sherpa-nemo-ctc
    files: [model.int8.onnx, vocab.txt]
    onnx_metadata:
      vocab_size: "257"
      normalize_type: per_feature
      subsampling_factor: "4"
      model_type: EncDecCTCModelBPE
      version: "1"
      model_author: ai4bharat

  # NVIDIA NeMo streaming fast-conformer CTC, English, 480 ms chunks, int8.
  # A genuinely incremental model: partial text appears while audio is still
  # arriving. Measured RTF 0.110 on 2 threads. First-sentence accuracy was
  # perfect on the reference recording; later sentences degraded on accented
  # conversational speech, so whisper-base remains the English default until
  # the hybrid partials+finals design lands in Phase 9.
  nemo-streaming-en:
    task: stt
    repo_id: csukuangfj/sherpa-onnx-nemo-streaming-fast-conformer-ctc-en-480ms-int8
    revision: 66e9b61a9fe334eba579700599e391c6ee093633
    languages: ["en"]
    size_mb: 132
    runtime: sherpa-nemo-ctc-streaming
    files: [model.int8.onnx, tokens.txt]

  # -- Translation ---------------------------------------------------------
  #
  # IndicTrans2 distilled 200M, CTranslate2 exports (constraint C6: the
  # PyTorch reference implementation cannot run on the target machine).
  # One checkpoint per direction. Loaded with compute_type=int8, so the
  # 847 MB fp32 download quantises to roughly 220 MB of RAM at load.
  #
  # Measured on the target machine (2 threads, beam 4): 0.19-1.3 s per
  # sentence, both directions, with the quality shown in
  # docs/phases/phase-05-translation.md.
  indictrans2-indic-en:
    task: mt
    repo_id: adalat-ai/ct2-rotary-indictrans2-indic-en-dist-200M
    revision: 524aade4f724dccbc6cd5ffb5e3c5c832a2baee4
    languages: ["ta", "hi", "te", "ml", "kn", "bn", "mr", "gu", "pa", "en"]
    size_mb: 856
    runtime: ctranslate2-seq2seq
    files:
      - indic-en-200m-ct2/ctranslate2_model/config.json
      - indic-en-200m-ct2/ctranslate2_model/model.bin
      - indic-en-200m-ct2/ctranslate2_model/source_vocabulary.json
      - indic-en-200m-ct2/ctranslate2_model/target_vocabulary.json
      - indic-en-200m-ct2/ctranslate2_model/vocab/model.SRC
      - indic-en-200m-ct2/ctranslate2_model/vocab/model.TGT

  indictrans2-en-indic:
    task: mt
    repo_id: adalat-ai/ct2-rotary-indictrans2-en-indic-dist-200M
    revision: ee04de9a86e42920ac310a0fe5a1505c85671b68
    languages: ["en", "ta", "hi", "te", "ml", "kn", "bn", "mr", "gu", "pa"]
    size_mb: 856
    runtime: ctranslate2-seq2seq
    files:
      - en-indic-200m-ct2/ctranslate2_model/config.json
      - en-indic-200m-ct2/ctranslate2_model/model.bin
      - en-indic-200m-ct2/ctranslate2_model/source_vocabulary.json
      - en-indic-200m-ct2/ctranslate2_model/target_vocabulary.json
      - en-indic-200m-ct2/ctranslate2_model/vocab/model.SRC
      - en-indic-200m-ct2/ctranslate2_model/vocab/model.TGT

  # -- Voice activity detection -------------------------------------------
  silero-vad:
    task: vad
    repo_id: onnx-community/silero-vad
    revision: e71cae966052b992a7eca6b17738916ce0eca4ec
    languages: ["*"]          # acoustic model, language independent
    size_mb: 3
    runtime: onnx
    files:
      - onnx/model.onnx
