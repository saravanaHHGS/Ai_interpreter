[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata
#
# pyproject.toml is the SINGLE SOURCE OF TRUTH for runtime dependencies.
# requirements.txt simply installs this project, so the two can never drift.
# ---------------------------------------------------------------------------
[project]
name = "ai-interpreter"
description = "Real-time speech-to-speech interpreter for Windows meeting applications."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hike Health GS" }]
keywords = ["speech-translation", "asr", "tts", "real-time", "interpreter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dynamic = ["version"]

# Phase 2 foundation dependencies only.
# Audio (Phase 3), STT (Phase 4), MT (Phase 5), TTS (Phase 6) and UI (Phase 8)
# dependencies are added in their own phases so every phase stays installable.
dependencies = [
    # Phase 2 - foundation
    "numpy>=2.1,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "PyYAML>=6.0.2,<7",
    "platformdirs>=4.3,<5",
    "psutil>=6.1,<8",
    # Phase 3 - audio capture
    "sounddevice>=0.5,<1",     # PortAudio bindings; ships the binary, no compiler needed
    "soundfile>=0.13,<1",      # WAV read/write for test recordings
    "soxr>=0.5,<2",            # stateful streaming resampling, correct across chunks
    "onnxruntime>=1.20,<2",    # runs Silero VAD; reused for TTS in Phase 6
    "huggingface-hub>=0.27,<2",  # model download with revision pinning
    # Phase 4 - speech to text
    "faster-whisper>=1.1,<2",  # Whisper on CTranslate2: int8, low memory
    "sherpa-onnx>=1.12,<2",    # NeMo conformer CTC: linear-cost, streaming-capable
    "onnx>=1.17,<2",           # metadata patching for exports missing sherpa keys
    # Phase 5 - translation
    "sentencepiece>=0.2,<1",   # IndicTrans2 tokenisation (CT2 needs token strings)
    # Phase 8 - desktop interface
    # Essentials only: QtWidgets/QtCore/QtGui without the 300 MB of Addons.
    # Verified to load and run under Smart App Control (Qt Company signing).
    "PySide6-Essentials>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<8",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
    # Pinned below 1.15 and installed from source (see scripts/bootstrap.ps1):
    # newer mypy depends on the compiled `librt` runtime, whose DLL Windows
    # Smart App Control blocks on the target machine - a cloud-reputation
    # verdict that flipped mid-project. Pure-Python mypy has no DLL to block.
    "mypy==1.14.1",
    "types-PyYAML>=6.0.2,<7",
]

[project.scripts]
ai-interpreter = "ai_interpreter.cli:main"

[project.urls]
Documentation = "https://github.com/hikehealth/ai-interpreter/tree/main/docs"

# ---------------------------------------------------------------------------
# Packaging - "src layout" prevents accidentally importing the working
# directory instead of the installed package.
# ---------------------------------------------------------------------------
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "ai_interpreter.__version__" }

# ---------------------------------------------------------------------------
# Ruff - linter + formatter (replaces flake8, isort, black, pyupgrade)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # PEP8 naming
    "UP",   # pyupgrade
    "B",    # bugbear (likely bugs)
    "A",    # builtin shadowing
    "C4",   # comprehensions
    "SIM",  # simplifications
    "RET",  # return statements
    "PTH",  # prefer pathlib over os.path
    "RUF",  # ruff-specific
]
ignore = [
    "RUF012", # mutable class attrs need ClassVar - noisy with pydantic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy - static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["ai_interpreter"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

# Native audio and ML libraries ship no type stubs. Silencing the import
# error is safe because each is used behind a port, so the untyped surface is
# confined to a single adapter class that its own tests cover.
[[tool.mypy.overrides]]
module = [
    "psutil.*",
    "sounddevice.*",
    "soundfile.*",
    "soxr.*",
    "onnxruntime.*",
    "hf_xet.*",
    "faster_whisper.*",
    "ctranslate2.*",
    "sherpa_onnx.*",
    "onnx.*",
    "sentencepiece.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
# requires_model tests run the real neural networks (slow, need the model
# cache); excluded by default so the developer loop stays fast. Run them
# with: pytest -m requires_model
addopts = '-ra --strict-markers --strict-config -m "not requires_model"'
markers = [
    "unit: fast, isolated tests with no external dependencies",
    "integration: tests that wire multiple components together",
    "performance: latency and throughput benchmarks",
    "stress: long-running load tests",
    "requires_audio: needs a real audio device",
    "requires_model: needs downloaded model weights",
]
asyncio_mode = "strict"

[tool.coverage.run]
source = ["src/ai_interpreter"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
